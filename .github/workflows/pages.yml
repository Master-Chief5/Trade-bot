# Publishes the app to GitHub Pages so RAs and deans can open it on a phone.
#
# ONE-TIME SETUP by a repo admin:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# Until that is done this workflow reports success and does nothing, so it never
# shows up as a red cross on a pull request. The moment Pages is switched on, the
# next push publishes, and every push after that keeps the site current.
name: pages

on:
  push:
    branches: [main, claude/dorm-room-check-app-lfjllv]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should win rather than queue behind an older deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-enabled:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.probe.outputs.enabled }}
    steps:
      - id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 404 here means Pages has not been switched on yet, which is not a failure.
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is off::Turn it on under Settings → Pages → Source: GitHub Actions, then push again to publish."
          fi

  pages-build:
    needs: pages-enabled
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # A project site lives under /<repo>/, so the build needs to know its prefix.
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      # Hash routing puts every route in the fragment, so index.html is the only entry
      # point and no 404 fallback is needed. .nojekyll stops Pages eating _-prefixed files.
      - run: touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
